# Spec B 接缝 7：tag 发版。打 v* tag 触发：windows job 产 exe+安装器挂 Release，
# ubuntu job npm publish。两 job 独立（npm 包无依赖 exe，串行简化编排）。
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}  # 手动触发便于调试

permissions:
  contents: write  # 发 GitHub Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:exe      # dist/memside-<version>.exe（package.json build:exe 内部已含 vite build + gen-manifest + compile）
      - uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install nsis -y
      - name: Install EnVar NSIS plugin + add makensis to PATH  # choco nsis 不带 EnVar 第三方插件（installer.nsi 依赖 EnVar::）；choco 装的 nsis 不写 PATH（makensis 找不到），本 step 同时把 NSIS 目录加到 GITHUB_PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$nsisDir")) { throw "NSIS dir not found: $nsisDir" }
          $zip = "$env:TEMP\EnVar-Plugin.zip"
          Invoke-WebRequest -Uri 'https://github.com/GsNSIS/EnVar/releases/download/v0.3.1/EnVar-Plugin.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $nsisDir -Force
          if (-not (Test-Path "$nsisDir\Plugins\x86-unicode\EnVar.dll")) { throw "EnVar.dll missing after extract" }
          # choco nsis 把 makensis.exe 放在 nsisDir 根，但不写 PATH —— 注入 GITHUB_PATH 让后续 step 能直接调 makensis
          if (-not (Test-Path "$nsisDir\makensis.exe")) { throw "makensis.exe not found: $nsisDir\makensis.exe" }
          Add-Content -Path $env:GITHUB_PATH -Value "$nsisDir"
          Write-Host "EnVar plugin + makensis on PATH: $nsisDir"
      - run: bun run build:installer  # installer/memside-setup-<version>.exe（makensis 读 installer/installer.nsi，APP_VERSION 由 script 注入）
        working-directory: ${{ github.workspace }}
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 产物名带版本号（发版约定 2026-08-20）：memside-<version>.exe /
          # memside-setup-<version>.exe（版本来自 package.json，经 bun run 注入
          # $npm_package_version）。dist/installer 均为本次构建干净产物，glob 无旧文件干扰。
          files: |
            dist/memside-*.exe
            installer/memside-setup-*.exe
          generate_release_notes: true

  publish-npm:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # prepublishOnly（package.json）已在 publish 前跑 bun run build，dist 新鲜。
